name: collect

on:
  schedule:
    # JST 17:00(UTC 08:00)に毎日実行(GitHub の schedule は混雑時に数十分遅れることがある)
    - cron: '0 8 * * *'
  workflow_dispatch:

# 夜間処理の claude(公演収集・受付期間の補完・画像の見せ方)で使うモデル。未指定だと CLI の既定に任される
env:
  CLAUDE_MODEL: claude-opus-5-5

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect with claude -p
        env:
          # `claude setup-token` で発行した長期トークン(Claudeプランの利用枠で動く)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p collector/out
          claude -p "$(cat collector/prompt.md)" \
            --model "$CLAUDE_MODEL" \
            --allowedTools "WebSearch,WebFetch,Edit(collector/out/**)" \
            --permission-mode acceptEdits \
            --max-turns 80 \
            --output-format text

      - name: Validate & ingest
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/validate.mjs collector/out/events.json

      # 2段目: 期間情報が欠けている公演をアーティスト単位で狙い撃ち補強
      - name: Enrich missing ticket periods
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/enrich.mjs 3

      # 3段目: ツアーページの og:image を取得(LLM 不使用。1公演1リクエスト)
      - name: Fetch tour images
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/fetch-images.mjs

      # 4段目: 一覧の正方形サムネに切り出す中心を、画像を見て決める(未設定の画像だけ。位置だけ送り、画像は保存しない)
      - name: Decide thumbnail focus
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/focus-images.mjs 10

      # 購入ページと判定できなかったホストを報告する(新しい販売サイトに気づくため)
      - name: Report unknown ticket hosts
        if: always()
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/report-unknown-hosts.mjs

      # 1段目(events.json)だけでなく2段目(enrich-*.json)も残す。
      # 収集内容を後から実データで追えないと、混入源が1段目か2段目か切り分けられない
      - name: Upload collected JSON (debug用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-json
          path: collector/out/*.json
          if-no-files-found: ignore
          retention-days: 14
