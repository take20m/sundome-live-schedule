name: collect

on:
  schedule:
    # JST 03:30(UTC 18:30)に毎日実行
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect with claude -p
        env:
          # `claude setup-token` で発行した長期トークン(Claudeプランの利用枠で動く)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p collector/out
          claude -p "$(cat collector/prompt.md)" \
            --allowedTools "WebSearch,WebFetch,Edit(collector/out/**)" \
            --permission-mode acceptEdits \
            --max-turns 80 \
            --output-format text

      - name: Validate & ingest
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/validate.mjs collector/out/events.json

      # 2段目: 期間情報が欠けている公演をアーティスト単位で狙い撃ち補強
      - name: Enrich missing ticket periods
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node collector/enrich.mjs 3

      - name: Upload collected JSON (debug用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-json
          path: collector/out/events.json
          if-no-files-found: ignore
          retention-days: 14
