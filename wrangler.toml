# Worker名とD1名はデプロイ済みリソースの内部名のため旧名のまま(リポジトリ名は sundome-live-schedule)
name = "sundome-reminder"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# プッシュ通知(docs/web-push.md)で web-push が node:crypto を使う
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "sundome.take20m.dev", custom_domain = true }
]

# workers.dev のURLは公開しない(独自ドメインのみ)
workers_dev = false
preview_urls = false

# INGEST_TOKEN は secret として設定する:
#   wrangler secret put INGEST_TOKEN
# ローカル開発時は .dev.vars に INGEST_TOKEN=... を書く

# content/ の Markdown を文字列として import する(記事・ガイド)
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# 静的ファイル(会場写真など)。パスが一致すれば Worker より先にアセットが返る
[assets]
directory = "./public"

# メール購読のフォームの Turnstile サイトキー(公開値)。RESEND_API_KEY と TURNSTILE_SECRET は secret
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAFM10veDlSgFw8cS"
# プッシュ通知(docs/web-push.md)の VAPID 公開鍵。秘密鍵 VAPID_PRIVATE_KEY は secret
VAPID_PUBLIC_KEY = "BN_5qvc2ARYVNkKX87sMuDfO30dYVt8M6ADcx1w4v1wNMxt-b1CvPQiG3xr68-5afe3PhdRDWIJTGDeMp27dfCw"

# 新着まとめメール(docs/email-digest.md)。毎日 12:00 JST(UTC 03:00)。
# RESEND_API_KEY が無いあいだは何もしない
[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sundome-reminder"
database_id = "d26ceca5-58bf-41ea-9243-6d034e2dcbb4"
